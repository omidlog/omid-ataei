    question_id: brand.verbal.voice_pairs
    value: "do: من پیشنهاد می‌کنم که… | don't: قول بهت می‌دم درآمدت حداقل دو برابر بشه; do: می‌خوام یک
      جمله رو صادقانه بگم… | don't: به نظرم همه باید الان با AI کار کنن; do: بریم ببینیم مشکل چیه |
      don't: به نظرم این کار بهتره; do: این تجربهٔ منه که از Fiko درس گرفتم | don't: من هر چیزی
      دربارهٔ استارتاپ می‌دونم; do: یک سؤال دارم ازت: مشتری تو واقعاً کیه؟ | don't: برای شروع این ۱۰
      تا کار رو بکن; do: ریسک این زیاده ولی ارزشش رو داره که امتحانش کنی | don't: اگه ریسک نکنی به
      هیچ جایی نمی‌رسی، پس با تمام وجود بیا وسط; do: بر اساس بررسی‌ای که توی سایت ادوایزر شده… |
      don't: معمولاً ۹۰ درصد استارتاپ‌ها موفق نمی‌شن; do: برندسازی یعنی یک قول به خودت بدی و هر روز
      سر اون قولت باشی | don't: برندت رو توی ۷ روز بساز; do: یکی از اشتباهات من توی طراحان آزاد این
      بود که… | don't: من هیچ وقت اشتباه نکردم"
    raw_answer: >-
      من پیشنهاد می‌کنم که… | قول بهت می‌دم درآمدت حداقل دو برابر بشه

      می‌خوام یک جمله رو صادقانه بگم… | به نظرم همه باید الان با AI کار کنن

      بریم ببینیم مشکل چیه | به نظرم این کار بهتره

      این تجربهٔ منه که از Fiko درس گرفتم | من هر چیزی دربارهٔ استارتاپ می‌دونم

      یک سؤال دارم ازت: مشتری تو واقعاً کیه؟ | برای شروع این ۱۰ تا کار رو بکن

      ریسک این زیاده ولی ارزشش رو داره که امتحانش کنی | اگه ریسک نکنی به هیچ جایی نمی‌رسی، پس با
      تمام وجود بیا وسط

      بر اساس بررسی‌ای که توی سایت ادوایزر شده… | معمولاً ۹۰ درصد استارتاپ‌ها موفق نمی‌شن

      برندسازی یعنی یک قول به خودت بدی و هر روز سر اون قولت باشی | برندت رو توی ۷ روز بساز

      یکی از اشتباهات من توی طراحان آزاد این بود که… | من هیچ وقت اشتباه نکردم
