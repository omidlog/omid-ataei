    question_id: business.marketing.journey
    value: "فرضیه، اندازه‌گیری‌نشده. آگاهی: ریلز و پست اینستاگرام، یوتیوب و لینکدین. بررسی: سایت
      omidataei.com، پروفایل لینکدین، و پشت صحنهٔ ساختن Fiko و دادوین. تبدیل: رزرو 1:1 Strategy
      Session از سایت، یا فرم تماس برای پروژه. نگهداشت: Strategic Review یا Ongoing Advisory بعد از
      جلسهٔ اول. توصیه: هنوز برنامه‌ای ندارد."
