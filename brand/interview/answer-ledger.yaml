  - answer_id: ans-0200
    question_id: personal.collaboration.policy
    value: "می‌پذیرم: همکاری با ابزارها و برندهای کسب‌وکار، استارتاپ، مارکتینگ و هوش مصنوعی که خودم
      می‌شناسم و به آن‌ها اعتماد دارم؛ رویداد و لایو مشترک با بنیان‌گذاران. رد می‌کنم: هر برندی که
      بوی کلاهبرداری بدهد، «یک‌شبه پولدار شو»، تضمین درآمد، و پیشنهادهای حقوقی، مالیاتی یا
      سرمایه‌گذاری. اعلام: هر محتوای پولی یا اسپانسری با برچسب واضح «تبلیغ» یا «همکاری پولی»؛ وقتی
      از Fiko یا دادوین حرف می‌زنم اعلام می‌کنم بنیان‌گذارشان هستم."
