  - answer_id: ans-0204
    question_id: business.cx.onboarding
    value: بعد از اولین جلسهٔ 1:1، فرد مشکل اصلی‌اش را روشن‌تر می‌بیند، فرض‌هایش به چالش کشیده شده، یک
