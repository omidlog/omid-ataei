  - id: brand.mascot.intensity
    module: mascot-expression
    field_path: brand.mascot.intensity
    label: Intensity scale
    prompt:
      en: How should emotional intensity be described (for example low, medium, high)?
      fa: شدت احساس چگونه توصیف شود (مثلاً کم، متوسط، زیاد)؟
      tr: Duygu yoğunluğu nasıl tarif edilsin (örneğin düşük, orta, yüksek)?
    why_it_matters: The catalog field emotion_intensity needs a shared scale.
    why_it_matters_i18n:
      fa: فیلد emotion_intensity در کاتالوگ به یک مقیاس مشترک نیاز دارد.
      tr: Katalogdaki emotion_intensity alanının ortak bir ölçeğe ihtiyacı var.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Use low, medium, high. Do not add a numeric score."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: از کم، متوسط، زیاد استفاده کنید. امتیاز عددی اضافه نکنید."
      tr:
        - "EXAMPLE ONLY: Düşük, orta, yüksek kullanın. Sayısal puan eklemeyin."
    required_when: always
    skip_when: config.modules.mascot == false
    depends_on:
      - brand.mascot.enabled
    priority: high
    order: 422
    sensitivity: internal
    language:
      - en
