schema_version: 1
questions:
  - id: brand.mascot.enabled
    module: mascot-identity
    field_path: brand.mascot.enabled
    label: Mascot
    prompt:
      en: Will this brand use a mascot or recurring character?
      fa: آیا این برند از یک مسکات یا شخصیت تکرارشونده استفاده می‌کند؟
      tr: Bu marka bir maskot veya tekrarlayan karakter kullanacak mı?
    why_it_matters: A no here removes mascot questions and hides the module. It does not delete the
      catalog from the template.
    why_it_matters_i18n:
      fa: پاسخ «نه» پرسش‌های مسکات را حذف و این ماژول را پنهان می‌کند، اما کاتالوگ را از قالب پاک نمی‌کند.
      tr: Burada hayır demek maskot sorularını kaldırır ve modülü gizler. Kataloğu şablondan silmez.
    question_type: boolean
    examples:
      - "EXAMPLE ONLY: no"
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: no"
      tr:
        - "EXAMPLE ONLY: no"
    suggestions:
      - yes
      - no
    required_when: always
    depends_on: []
    priority: critical
    order: 8
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: &a1
      - owner
      - approved_import
      - external_cited
      - agent_suggestion
    related_outputs:
      - brand/generated/drafts/mascot-identity.md
    related_ids: []
    completion_rule: boolean
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.mascot.role
    module: mascot-identity
    field_path: brand.mascot.role
    label: Character role
    prompt:
      en: What job does the character do in the brand?
      fa: شخصیت در برند چه کاری انجام می‌دهد؟
      tr: Karakter markada hangi işi yapar?
    why_it_matters: A role limits where the character appears.
    why_it_matters_i18n:
      fa: نقش مشخص، جاهایی را که شخصیت ظاهر می‌شود محدود می‌کند.
      tr: Bir rol, karakterin nerede görüneceğini sınırlar.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: A guide for empty states. Not a spokesperson for legal claims."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: راهنمایی برای حالت‌های خالی؛ نه سخنگوی ادعاهای حقوقی."
      tr:
        - "EXAMPLE ONLY: Boş durumlar için bir rehber. Hukuki iddiaların sözcüsü değil."
    required_when: answers[brand.mascot.enabled] == yes
    skip_when: config.modules.mascot == false
    depends_on:
      - brand.mascot.enabled
    priority: high
    order: 400
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/mascot-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.mascot.personality
    module: mascot-identity
    field_path: brand.mascot.personality
    label: Character personality
    prompt:
      en: Which character traits extend the brand personality, and which are forbidden?
      fa: کدام ویژگی‌های شخصیت، شخصیت برند را گسترش می‌دهند و کدام ممنوع‌اند؟
      tr: Hangi karakter özellikleri marka kişiliğini genişletir ve hangileri yasaktır?
    why_it_matters: The character is not a second brand.
    why_it_matters_i18n:
      fa: شخصیت، برند دوم نیست.
      tr: Karakter ikinci bir marka değildir.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Curious, never mean. Must still match the brand traits once those exist."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: کنجکاو، هرگز بدجنس. وقتی ویژگی‌های برند تعریف شد، باید با آن‌ها هم هماهنگ
          باشد."
      tr:
        - "EXAMPLE ONLY: Meraklı, asla kaba değil. Marka özellikleri belirlendiğinde onlarla da
          uyumlu olmalı."
    required_when: always
    skip_when: config.modules.mascot == false
    depends_on:
      - brand.mascot.enabled
      - brand.personality.traits
    priority: high
    order: 401
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/mascot-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.mascot.anatomy
    module: mascot-identity
    field_path: brand.mascot.anatomy
    label: Anatomy rules
    prompt:
      en: What anatomical or silhouette rules must stay true once art exists?
      fa: وقتی طرح وجود داشت، کدام قواعد آناتومی یا سیلوئت باید درست بمانند؟
      tr: Çizim olunca hangi anatomi veya siluet kuralları doğru kalmalı?
    why_it_matters: Expressions are useless if the body plan is unstable.
    why_it_matters_i18n:
      fa: اگر ساختار بدن ثابت نباشد، حالت‌های چهره بی‌فایده‌اند.
      tr: Vücut planı tutarsızsa ifadelerin bir faydası olmaz.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: TBD. No approved model sheet. Do not invent limb counts."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: TBD. هنوز شیت مدل تأییدشده‌ای وجود ندارد. تعداد اندام‌ها را از خودتان
          نسازید."
      tr:
        - "EXAMPLE ONLY: TBD. Onaylı model paftası yok. Uzuv sayısı uydurmayın."
    required_when: always
    skip_when: config.modules.mascot == false
    depends_on:
      - brand.mascot.enabled
    priority: high
    order: 402
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/mascot-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.mascot.forbidden
    module: mascot-identity
    field_path: brand.mascot.forbidden
    label: Forbidden distortions
    prompt:
      en: Which distortions are always forbidden?
      fa: کدام تحریف‌ها همیشه ممنوع‌اند؟
      tr: Hangi bozulmalar her zaman yasak?
    why_it_matters: The bible needs a no list before production volume grows.
    why_it_matters_i18n:
      fa: پیش از آنکه حجم تولید بالا برود، راهنمای شخصیت به فهرست ممنوعه‌ها نیاز دارد.
      tr: Üretim hacmi büyümeden önce karakter rehberinin bir yasaklar listesine ihtiyacı var.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: No extra limbs, no copied characters, no unsafe stereotypes."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: بدون اندام اضافه، بدون کپی از شخصیت‌های دیگر، بدون کلیشه‌های ناامن."
      tr:
        - "EXAMPLE ONLY: Fazladan uzuv yok, kopya karakter yok, güvensiz stereotip yok."
    required_when: always
    skip_when: config.modules.mascot == false
    depends_on:
      - brand.mascot.enabled
    priority: high
    order: 403
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/mascot-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.mascot.palette
    module: mascot-identity
    field_path: brand.mascot.palette
    label: Character palette
    prompt:
      en: How should the character palette relate to brand color roles? Hues stay TBD until art is
        approved.
      fa: پالت شخصیت چگونه به نقش‌های رنگ برند مربوط شود؟ تا تأیید طرح، فام‌ها TBD می‌مانند.
      tr: Karakter paleti marka renk rollerine nasıl bağlansın? Çizim onaylanana kadar tonlar TBD kalsın.
    why_it_matters: Character color is a token decision, not a one-off PNG.
    why_it_matters_i18n:
      fa: رنگ شخصیت یک تصمیم توکنی است، نه یک فایل PNG یک‌باره.
      tr: Karakter rengi tek seferlik bir PNG değil, bir token kararıdır.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Use semantic roles. No unique hex until approval."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: از نقش‌های معنایی استفاده کنید. تا پیش از تأیید، هیچ hex اختصاصی تعریف
          نشود."
      tr:
        - "EXAMPLE ONLY: Anlamsal rolleri kullanın. Onaya kadar özel hex yok."
    required_when: always
    skip_when: config.modules.mascot == false
    depends_on:
      - brand.mascot.enabled
    priority: high
    order: 404
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
