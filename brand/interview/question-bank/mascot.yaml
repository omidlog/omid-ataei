  - id: brand.mascot.stage_count
    module: mascot-evolution
    field_path: brand.mascot.stage_count
    label: Stage count
    prompt:
      en: How many visual stages should the character have? Use 1 if the character does not evolve.
      fa: شخصیت چند مرحلهٔ بصری داشته باشد؟ اگر تکامل نمی‌یابد، ۱.
      tr: Karakterin kaç görsel aşaması olsun? Evrim yoksa 1.
    why_it_matters: The example file has six stages so the schema is proven. Your brand picks the count.
    why_it_matters_i18n:
      fa: فایل نمونه شش مرحله دارد تا درستی ساختار داده نشان داده شود. تعداد مرحله‌ها را برند شما انتخاب
        می‌کند.
      tr: Örnek dosyada şemanın çalıştığını göstermek için altı aşama var. Aşama sayısını markanız seçer.
    question_type: number
    examples:
      - "EXAMPLE ONLY: 1"
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: 1"
      tr:
        - "EXAMPLE ONLY: 1"
    required_when: always
    skip_when: config.modules.mascot == false
    depends_on:
      - brand.mascot.enabled
    priority: high
    order: 440
