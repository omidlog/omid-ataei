  - id: brand.mascot.emotion_priority
    module: mascot-expression
    field_path: brand.mascot.emotion_priority
    label: Emotion priority
    prompt:
      en: Which emotions matter first for this brand?
      fa: کدام احساس‌ها برای این برند اول مهم‌اند؟
      tr: Bu marka için önce hangi duygular önemli?
    why_it_matters: The long catalog is a backlog. Priority decides the first model sheet.
    why_it_matters_i18n:
      fa: کاتالوگ بلند فقط فهرست کارهای آینده است؛ اولویت تعیین می‌کند اولین شیت مدل چه باشد.
      tr: Uzun katalog bir bekleyen iş listesidir. İlk model paftasını öncelik belirler.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: joyful, curious, determined. Others remain backlog."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: joyful، curious، determined. بقیه در فهرست کارهای آینده می‌مانند."
      tr:
        - "EXAMPLE ONLY: joyful, curious, determined. Diğerleri bekleyen listede kalır."
    required_when: always
    skip_when: config.modules.mascot == false
    depends_on:
      - brand.mascot.enabled
    priority: high
    order: 420
    sensitivity: internal
    language:
