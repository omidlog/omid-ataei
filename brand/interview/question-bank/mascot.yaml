  - id: brand.mascot.mvp
    module: mascot-expression
    field_path: brand.mascot.mvp
    label: MVP states
    prompt:
      en: Confirm or edit the starter MVP state ids. Leave the default set if you have no opinion.
      fa: شناسه‌های MVP آغازین را تأیید یا ویرایش کنید. اگر نظری ندارید، مجموعهٔ پیش‌فرض بماند.
      tr: Başlangıç MVP durum kimliklerini onaylayın veya düzenleyin. Fikriniz yoksa varsayılan küme
        kalsın.
    why_it_matters: The catalog flags an MVP subset so production does not try to draw all 90 states.
    why_it_matters_i18n:
      fa: کاتالوگ یک زیرمجموعهٔ MVP را علامت‌گذاری می‌کند تا تولید سراغ کشیدن هر 90 حالت نرود.
      tr: Katalog bir MVP alt kümesini işaretler; böylece üretim 90 durumun hepsini çizmeye kalkışmaz.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Use the flagged MVP ids in brand/mascot/catalog.yaml."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: از idهای MVP علامت‌خورده در brand/mascot/catalog.yaml استفاده کنید."
      tr:
        - "EXAMPLE ONLY: brand/mascot/catalog.yaml içindeki işaretli MVP id'lerini kullanın."
    required_when: always
    skip_when: config.modules.mascot == false
    depends_on:
