    status: unanswered
  - id: brand.mascot.situation_map
    module: mascot-expression
    field_path: brand.mascot.situation_map
    label: Situation map
    prompt:
      en: Which product situations need a character reaction first?
      fa: کدام موقعیت‌های محصول اول به واکنش شخصیت نیاز دارند؟
      tr: Hangi ürün durumları önce bir karakter tepkisi ister?
    why_it_matters: UI states should be requested from real screens, not from a generic poster.
    why_it_matters_i18n:
      fa: حالت‌های رابط کاربری باید از صفحه‌های واقعی درخواست شوند، نه از یک پوستر عمومی.
      tr: Arayüz durumları genel bir posterden değil, gerçek ekranlardan istenmeli.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Empty, success, and failure. Loading can stay typographic."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: خالی، موفقیت و خطا. حالت بارگذاری می‌تواند فقط تایپوگرافیک بماند."
      tr:
        - "EXAMPLE ONLY: Boş, başarı ve hata. Yükleniyor durumu tipografik kalabilir."
    required_when: always
    skip_when: config.modules.mascot == false
    depends_on:
      - brand.mascot.enabled
    priority: high
    order: 421
    sensitivity: internal
    language:
      - en
