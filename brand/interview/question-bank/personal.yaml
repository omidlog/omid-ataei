schema_version: 1
questions:
  - id: personal.identity.public_name
    module: personal-identity
    field_path: personal.identity.public_name
    label: Public name
    prompt:
      en: What name should we use for you in public, exactly as it should appear?
      fa: در فضای عمومی دقیقاً با چه نامی معرفی شوید؟ همان‌طور که باید نوشته شود.
      tr: Kamuya açık alanda tam olarak hangi adı kullanalım? Yazılması gerektiği gibi yazın.
    why_it_matters: Every bio, profile and introduction starts from one canonical name.
    why_it_matters_i18n:
      fa: هر بیوگرافی، پروفایل و معرفی از یک نام رسمی و واحد شروع می‌شود.
      tr: Her biyografi, profil ve tanıtım tek bir resmî addan yola çıkar.
    question_type: short_text
    examples:
      - "EXAMPLE ONLY: Alex Example"
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: Alex Example"
      tr:
        - "EXAMPLE ONLY: Alex Example"
    required_when: always
    depends_on: []
    priority: critical
    order: 1
    sensitivity: public
    language:
      - en
      - fa
      - tr
    source_types: &a1
      - owner
      - approved_import
      - external_cited
      - agent_suggestion
    related_outputs:
      - brand/generated/drafts/personal-identity.md
    related_ids:
      - business.identity.trade_name
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: personal.identity.headline
    module: personal-identity
    field_path: personal.identity.headline
    label: Professional headline
    prompt:
      en: What professional title or one-line headline should appear next to your name?
      fa: چه عنوان حرفه‌ای یا تیتر یک‌خطی باید کنار نام شما بیاید؟
      tr: Adınızın yanında hangi mesleki unvan veya tek satırlık başlık görünmeli?
    why_it_matters: The headline is reused in bios, LinkedIn, speaker sheets and the website hero.
    why_it_matters_i18n:
      fa: این تیتر در بیوگرافی‌ها، لینکدین، برگه‌های معرفی سخنران و بخش اصلی وب‌سایت دوباره به کار می‌رود.
      tr: Başlık; biyografilerde, LinkedIn'de, konuşmacı tanıtım sayfalarında ve web sitesinin ana
        bölümünde yeniden kullanılır.
    question_type: short_text
    examples:
      - "EXAMPLE ONLY: Product strategy advisor for early-stage teams"
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: مشاور استراتژی محصول برای تیم‌های نوپا"
      tr:
        - "EXAMPLE ONLY: Erken aşama ekipler için ürün stratejisi danışmanı"
    required_when: always
    depends_on: []
    priority: critical
    order: 2
    sensitivity: public
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: personal.identity.roles
    module: personal-identity
    field_path: personal.identity.roles
    label: Roles, specialties and industries
    prompt:
      en: Which roles, specialties and industries describe your work today?
      fa: کدام نقش‌ها، تخصص‌ها و صنایع کار امروز شما را توصیف می‌کنند؟
      tr: Bugünkü işinizi hangi roller, uzmanlıklar ve sektörler tanımlar?
    why_it_matters: Roles decide which facets and documents are relevant.
    why_it_matters_i18n:
      fa: نقش‌ها تعیین می‌کنند کدام جنبه‌ها و اسناد مرتبط هستند.
      tr: Roller, hangi yönlerin ve belgelerin ilgili olduğunu belirler.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Advisor and workshop facilitator; product strategy; education technology."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: مشاور و تسهیل‌گر کارگاه؛ استراتژی محصول؛ فناوری آموزشی."
      tr:
        - "EXAMPLE ONLY: Danışman ve atölye kolaylaştırıcısı; ürün stratejisi; eğitim teknolojisi."
    required_when: always
    depends_on: []
    priority: high
    order: 3
    sensitivity: public
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: personal.identity.name_forms
    module: personal-identity
    field_path: personal.identity.name_forms
    label: Other approved name forms
    prompt:
      en: "Are there other approved forms of your name: a short form, a transliteration, or the name in
        another script?"
      fa: "آیا شکل‌های تأییدشدهٔ دیگری از نام شما هست: شکل کوتاه، آوانویسی یا نام به خطی دیگر؟"
      tr: "Adınızın onaylı başka biçimleri var mı: kısa biçim, harf çevirisi veya başka bir yazıdaki
        adınız?"
    why_it_matters: Mixed-language audiences see the name in more than one script. Each form must be
      approved, not guessed.
    why_it_matters_i18n:
      fa: مخاطبان چندزبانه نام را با بیش از یک خط می‌بینند. هر شکل نام باید تأیید شده باشد، نه حدسی.
      tr: Farklı dillerden oluşan kitleler adı birden fazla yazı sisteminde görür. Her biçim tahmin
        edilmemeli, onaylanmalıdır.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Short form: Alex E. Transliteration approved by the owner."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: شکل کوتاه: Alex E. آوانویسی تأییدشده توسط مالک."
      tr:
        - "EXAMPLE ONLY: Kısa biçim: Alex E. Sahibi tarafından onaylanmış transliterasyon."
    required_when: always
    depends_on:
      - personal.identity.public_name
    priority: medium
    order: 4
    sensitivity: public
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: false
    weight: 1
    sector_hints: []
    status: unanswered
  - id: personal.identity.localized_headline
    module: personal-identity
    field_path: personal.identity.localized_headline
    label: Localized headline
    prompt:
      en: What is the approved headline in each of your other languages? Translations are drafts until you
        approve them.
      fa: تیتر تأییدشدهٔ شما در هر یک از زبان‌های دیگرتان چیست؟ ترجمه‌ها تا تأیید شما پیش‌نویس‌اند.
      tr: Diğer dillerinizdeki onaylı başlık nedir? Çeviriler siz onaylayana kadar taslaktır.
    why_it_matters: A translated claim is a new claim. It is never auto-approved.
    why_it_matters_i18n:
      fa: ادعای ترجمه‌شده، ادعایی تازه است و هرگز به‌طور خودکار تأیید نمی‌شود.
      tr: Çevrilmiş bir iddia yeni bir iddiadır. Asla otomatik olarak onaylanmaz.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: tr: Erken aşama ekipler için ürün stratejisi danışmanı (draft)."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: tr: Erken aşama ekipler için ürün stratejisi danışmanı (پیش‌نویس)."
      tr:
        - "EXAMPLE ONLY: tr: Erken aşama ekipler için ürün stratejisi danışmanı (taslak)."
    required_when: always
    depends_on:
      - personal.identity.headline
    priority: low
    order: 5
    sensitivity: public
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: false
    weight: 1
    sector_hints: []
    status: unanswered
  - id: personal.identity.service_scope
    module: personal-identity
    field_path: personal.identity.service_scope
    label: Geographic service scope
    prompt:
      en: Where do you work or serve clients? A region or "remote" is enough. Never give a home address.
      fa: کجا کار می‌کنید یا به مشتری خدمت می‌دهید؟ یک منطقه یا «دورکار» کافی است. هرگز آدرس منزل ندهید.
      tr: Nerede çalışıyor veya müşterilere hizmet veriyorsunuz? Bir bölge ya da "uzaktan" yeterli. Asla
        ev adresi vermeyin.
    why_it_matters: Service scope helps the right audience; a precise address is private.
    why_it_matters_i18n:
      fa: محدوده‌ی خدمات به رسیدن به مخاطب درست کمک می‌کند؛ نشانی دقیق، خصوصی است.
      tr: Hizmet kapsamı doğru kitleye ulaşmaya yardımcı olur; kesin bir adres ise özeldir.
    question_type: short_text
    examples:
      - "EXAMPLE ONLY: Europe and remote."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: اروپا و به‌صورت دورکاری."
      tr:
        - "EXAMPLE ONLY: Avrupa ve uzaktan."
    required_when: always
    depends_on: []
    priority: medium
    order: 6
    sensitivity: public
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: false
    weight: 1
    sector_hints: []
    status: unanswered
  - id: personal.identity.pronouns
    module: personal-identity
    field_path: personal.identity.pronouns
    label: Pronouns (optional)
    prompt:
      en: "Optional: are there pronouns you want shown publicly? Say skip if this is not relevant."
      fa: "اختیاری: آیا ضمیری هست که بخواهید عمومی نمایش داده شود؟ اگر مربوط نیست، رد کنید."
      tr: "İsteğe bağlı: herkese açık gösterilmesini istediğiniz zamirler var mı? İlgili değilse atlayın."
    why_it_matters: Only recorded when volunteered. Never inferred from a name.
    why_it_matters_i18n:
      fa: فقط وقتی ثبت می‌شود که خودتان بگویید. هرگز از روی نام حدس زده نمی‌شود.
      tr: Yalnızca kendiliğinden belirtildiğinde kaydedilir. Asla addan çıkarım yapılmaz.
    question_type: short_text
    examples:
      - "EXAMPLE ONLY: Skipped."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: صرف‌نظر شد."
      tr:
        - "EXAMPLE ONLY: Atlandı."
    required_when: always
    depends_on: []
    priority: low
    order: 7
    sensitivity: public
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: false
    weight: 1
    sector_hints: []
    status: unanswered
  - id: personal.positioning.known_for
    module: personal-positioning
    field_path: personal.positioning.known_for
    label: Known for
    prompt:
      en: In one sentence, what should you be known for, and by whom?
      fa: در یک جمله، به چه چیزی و نزد چه کسانی باید شناخته شوید؟
      tr: Tek cümleyle, ne ile ve kimler tarafından tanınmalısınız?
    why_it_matters: The positioning sentence anchors bios and headlines.
    why_it_matters_i18n:
      fa: جمله‌ی جایگاه‌یابی، پایه‌ی بیوگرافی‌ها و تیترهاست.
      tr: Konumlandırma cümlesi, biyografilerin ve başlıkların dayanağıdır.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Known for practical product discovery, by early-stage founders."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: شناخته‌شده نزد بنیان‌گذاران استارتاپ‌های نوپا برای کشف محصول به شیوه‌ای
          کاربردی."
      tr:
        - "EXAMPLE ONLY: Erken aşama girişim kurucuları arasında pratik ürün keşfiyle tanınır."
    required_when: always
    depends_on: []
    priority: critical
    order: 10
    sensitivity: public
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-positioning.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: personal.positioning.primary_audience
    module: personal-positioning
    field_path: personal.positioning.primary_audience
    label: Primary audience
    prompt:
      en: "Who is your primary audience today: clients, employers, a community, peers or media?"
      fa: "مخاطب اصلی امروز شما کیست: مشتریان، کارفرمایان، یک جامعه، همکاران یا رسانه؟"
      tr: "Bugünkü birincil kitleniz kim: müşteriler, işverenler, bir topluluk, meslektaşlar veya medya?"
    why_it_matters: Every channel and document is written for someone in particular.
    why_it_matters_i18n:
      fa: هر کانال و سندی برای مخاطبی مشخص نوشته می‌شود.
      tr: Her kanal ve belge belirli biri için yazılır.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Seed-stage founders without a product lead."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: بنیان‌گذاران استارتاپ‌های مرحله‌ی بذر که مدیر محصول ندارند."
      tr:
        - "EXAMPLE ONLY: Ürün lideri olmayan tohum aşamasındaki girişim kurucuları."
    required_when: always
    depends_on: []
    priority: critical
    order: 11
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-positioning.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: personal.positioning.expertise
    module: personal-positioning
    field_path: personal.positioning.expertise
    label: Expertise topics
    prompt:
      en: Which topic clusters are you an expert in, and which of them can you demonstrate with work?
      fa: در کدام خوشه‌های موضوعی متخصص هستید و کدام را می‌توانید با کار نشان دهید؟
      tr: Hangi konu kümelerinde uzmansınız ve hangilerini işle gösterebilirsiniz?
    why_it_matters: Expertise without evidence is labeled unverified.
    why_it_matters_i18n:
      fa: تخصص بدون شاهد، «تأییدنشده» برچسب می‌خورد.
      tr: Kanıtı olmayan uzmanlık «doğrulanmamış» olarak etiketlenir.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Product discovery (portfolio), pricing research (one case study)."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: کشف محصول (نمونه‌کار)، پژوهش قیمت‌گذاری (یک مطالعه‌ی موردی)."
      tr:
        - "EXAMPLE ONLY: Ürün keşfi (portfolyo), fiyatlandırma araştırması (bir vaka çalışması)."
    required_when: always
    depends_on: []
    priority: high
    order: 12
    sensitivity: public
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-positioning.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
