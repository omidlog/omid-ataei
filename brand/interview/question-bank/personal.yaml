  - id: personal.positioning.perspective
    module: personal-positioning
    field_path: personal.positioning.perspective
    label: Point of view
    prompt:
      en: What do you believe about your field that others often get wrong?
      fa: دربارهٔ حوزهٔ کاری‌تان به چه چیزی باور دارید که دیگران اغلب اشتباه می‌کنند؟
      tr: Alanınız hakkında başkalarının sıkça yanlış bildiği neye inanıyorsunuz?
    why_it_matters: A point of view separates a person from a job title.
    why_it_matters_i18n:
      fa: دیدگاه، یک فرد را از یک عنوان شغلی متمایز می‌کند.
      tr: Bir bakış açısı, kişiyi bir iş unvanından ayırır.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Most roadmaps fail because nobody wrote down what was decided."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: بیشتر نقشه‌های راه شکست می‌خورند، چون هیچ‌کس تصمیم‌های گرفته‌شده را ثبت
          نکرده است."
      tr:
        - "EXAMPLE ONLY: Yol haritalarının çoğu, kimse alınan kararları yazıya dökmediği için
          başarısız olur."
    required_when: always
    depends_on: []
    priority: high
    order: 14
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-positioning.md
      - brand/generated/drafts/personal-content.md
    related_ids: []
