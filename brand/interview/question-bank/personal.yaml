  - id: personal.services.offers
    module: personal-positioning
    field_path: personal.services.offers
    label: Offers
    prompt:
      en: Which offers exist today (advisory, consulting, coaching, speaking, products, courses), and
        which are only ideas for later?
      fa: کدام پیشنهادها امروز وجود دارند (مشاوره، کوچینگ، سخنرانی، محصول، دوره) و کدام فقط ایده‌ای برای
        بعد هستند؟
      tr: Bugün hangi teklifler var (danışmanlık, koçluk, konuşma, ürün, kurs) ve hangileri yalnızca
        sonraya dair fikir?
    why_it_matters: A future idea published as an offer is a false claim.
    why_it_matters_i18n:
      fa: ایده‌ای برای آینده که به‌عنوان خدمت منتشر شود، ادعایی نادرست است.
      tr: Hizmet olarak yayımlanan bir gelecek fikri yanlış bir iddiadır.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Exists: two-week discovery sprint. Idea: online course (not offered)."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: موجود: اسپرینت کشف دوهفته‌ای. ایده: دوره‌ی آنلاین (ارائه نمی‌شود)."
      tr:
        - "EXAMPLE ONLY: Mevcut: iki haftalık keşif sprinti. Fikir: çevrim içi kurs (sunulmuyor)."
    required_when: always
    depends_on: []
    priority: high
    order: 15
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-positioning.md
    related_ids:
      - business.offer.summary
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: personal.positioning.boundaries
    module: personal-positioning
    field_path: personal.positioning.boundaries
    label: Expertise boundaries
    prompt:
      en: Which topics are outside your expertise, so nobody presents you as an expert on them?
      fa: کدام موضوعات خارج از تخصص شما هستند تا کسی شما را متخصص آن‌ها معرفی نکند؟
      tr: Hangi konular uzmanlığınızın dışında, böylece kimse sizi o konularda uzman olarak sunmasın?
    why_it_matters: Boundaries stop an agent from overstating expertise.
