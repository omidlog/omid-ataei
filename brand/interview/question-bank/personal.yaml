    sector_hints: []
    status: unanswered
  - id: personal.positioning.outcome
    module: personal-positioning
    field_path: personal.positioning.outcome
    label: Outcome you help create
    prompt:
      en: What change do people get from working with you or following your work? Say what you can show,
        not what you hope.
      fa: مردم از کار با شما یا دنبال‌کردن کارتان چه تغییری می‌گیرند؟ آنچه را می‌توانید نشان دهید بگویید،
        نه آنچه امید دارید.
      tr: İnsanlar sizinle çalışarak veya işinizi takip ederek ne değişim elde eder? Umduğunuzu değil,
        gösterebileceğinizi söyleyin.
    why_it_matters: Promised outcomes must be demonstrable; otherwise they are hypotheses.
    why_it_matters_i18n:
      fa: نتایجی که وعده داده می‌شوند باید قابل نشان‌دادن باشند؛ وگرنه فرضیه‌اند.
      tr: Vaat edilen sonuçlar gösterilebilir olmalıdır; aksi hâlde birer hipotezdir.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: A prioritized roadmap at the end of an engagement. No performance promise."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: یک نقشه‌ی راه اولویت‌بندی‌شده در پایان همکاری. بدون وعده‌ی عملکرد."
      tr:
        - "EXAMPLE ONLY: Çalışmanın sonunda önceliklendirilmiş bir yol haritası. Performans vaadi
          yok."
    required_when: always
    depends_on: []
    priority: high
    order: 13
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/personal-positioning.md
    related_ids: []
