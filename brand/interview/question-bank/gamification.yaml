schema_version: 1
questions:
  - id: brand.gamification.enabled
    module: gamification
    field_path: brand.gamification.enabled
    label: Gamification
    prompt:
      en: Will this brand use game-like progress visuals (levels, streaks, badges, rewards)?
      fa: آیا این برند از تصویرهای پیشرفت بازی‌مانند (سطح، زنجیره، نشان، پاداش) استفاده می‌کند؟
      tr: Bu marka oyun benzeri ilerleme görselleri (seviye, seri, rozet, ödül) kullanacak mı?
    why_it_matters: Turning this off hides the module and skips the rest of the questions.
    why_it_matters_i18n:
      fa: خاموش کردن این گزینه ماژول را پنهان می‌کند و بقیهٔ پرسش‌ها را رد می‌کند.
      tr: Bunu kapatmak modülü gizler ve kalan soruları atlar.
    question_type: boolean
    examples:
      - "EXAMPLE ONLY: no"
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: no"
      tr:
        - "EXAMPLE ONLY: no"
    required_when: always
    depends_on: []
    priority: high
    order: 11
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: &a1
      - owner
      - approved_import
      - external_cited
      - agent_suggestion
    related_outputs:
      - brand/generated/drafts/gamification.md
    related_ids: []
    completion_rule: boolean
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.gamification.model
    module: gamification
    field_path: brand.gamification.model
    label: Progress model
    prompt:
      en: What progress visuals are in scope? Leave mechanics as placeholders.
      fa: کدام تصویرهای پیشرفت در محدوده‌اند؟ مکانیک‌ها را جای‌نگهدار بگذارید.
      tr: Hangi ilerleme görselleri kapsamda? Mekanikleri yer tutucu bırakın.
    why_it_matters: Visual design can start before the economy exists, if it does not invent the economy.
    why_it_matters_i18n:
      fa: طراحی بصری می‌تواند پیش از وجود اقتصاد بازی شروع شود، به شرطی که آن اقتصاد را از خود نسازد.
      tr: Görsel tasarım, ekonomiyi uydurmadığı sürece ekonomi var olmadan başlayabilir.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: A progress indicator only. No points."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: فقط یک نشانگر پیشرفت. بدون امتیاز."
      tr:
        - "EXAMPLE ONLY: Yalnızca bir ilerleme göstergesi. Puan yok."
    required_when: answers[brand.gamification.enabled] == yes
    skip_when: config.modules.gamification == false
    depends_on:
      - brand.gamification.enabled
    priority: high
    order: 700
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/gamification.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.gamification.streaks
    module: gamification
    field_path: brand.gamification.streaks
    label: Streak policy
    prompt:
      en: If streaks are shown, what emotional rule limits them? Do not set a day count unless product
        already has.
      fa: اگر زنجیره نشان داده می‌شود، کدام قاعدهٔ احساسی آن را محدود می‌کند؟ تعداد روز را نگذارید مگر
        محصول از قبل داشته باشد.
      tr: Seri gösteriliyorsa onu hangi duygu kuralı sınırlar? Üründe yoksa gün sayısı koymayın.
    why_it_matters: Streak UIs easily become punitive. The brand can forbid that without defining the mechanic.
    why_it_matters_i18n:
      fa: رابط‌های زنجیره به‌راحتی تنبیهی می‌شوند. برند می‌تواند بدون تعریف مکانیک، این را ممنوع کند.
      tr: Seri arayüzleri kolayca cezalandırıcı hâle gelir. Marka, mekaniği tanımlamadan bunu
        yasaklayabilir.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: No streak until product defines one. No shame copy."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: تا وقتی محصول زنجیره‌ای تعریف نکرده، زنجیره‌ای در کار نیست. بدون متن
          شرمنده‌کننده."
      tr:
        - "EXAMPLE ONLY: Ürün tanımlayana kadar seri yok. Utandırıcı metin yok."
    required_when: always
    skip_when: config.modules.gamification == false
    depends_on:
      - brand.gamification.enabled
    priority: high
    order: 701
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/gamification.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.gamification.ethics
    module: gamification
    field_path: brand.gamification.ethics
    label: Reward ethics
    prompt:
      en: Which manipulative patterns are forbidden in rewards and celebrations?
      fa: کدام الگوهای دستکاری در پاداش و جشن ممنوع‌اند؟
      tr: Ödül ve kutlamalarda hangi manipülatif örüntüler yasak?
    why_it_matters: The spec requires anti-manipulative constraints, not a points fantasy.
    why_it_matters_i18n:
      fa: مشخصات، محدودیت‌های ضددستکاری را الزامی می‌کند، نه یک خیال‌پردازی امتیازی.
      tr: Şartname bir puan fantezisi değil, manipülasyon karşıtı kısıtlar ister.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: No fake scarcity, no hidden odds, no punishment for rest."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: بدون کمیابی ساختگی، بدون احتمال‌های پنهان، بدون تنبیه برای استراحت."
      tr:
        - "EXAMPLE ONLY: Sahte kıtlık yok, gizli olasılık yok, dinlenmeye ceza yok."
    required_when: always
    skip_when: config.modules.gamification == false
    depends_on:
      - brand.gamification.enabled
    priority: high
    order: 702
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/gamification.md
      - brand/generated/drafts/brand-strategy.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.gamification.failure
    module: gamification
    field_path: brand.gamification.failure
    label: Failure tone
    prompt:
      en: How should a failed or missed attempt look and sound?
      fa: یک تلاش ناموفق یا ازدست‌رفته چگونه دیده و شنیده شود؟
      tr: Başarısız veya kaçırılmış bir deneme nasıl görünsün ve duyulsun?
    why_it_matters: Failure is a brand moment. It maps to mascot and voice rules.
    why_it_matters_i18n:
      fa: شکست یک لحظهٔ برند است و به قواعد مسکات و لحن مربوط می‌شود.
      tr: Başarısızlık bir marka anıdır. Maskot ve ses kurallarına bağlanır.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Neutral and specific. Offer a next step. No buzzer."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: خنثی و مشخص. یک گام بعدی پیشنهاد دهید. بدون صدای بوق خطا."
      tr:
        - "EXAMPLE ONLY: Tarafsız ve net. Bir sonraki adımı önerin. Hata zili yok."
    required_when: always
    skip_when: config.modules.gamification == false
    depends_on:
      - brand.gamification.enabled
    priority: high
    order: 703
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/gamification.md
      - brand/generated/drafts/mascot-expression.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.gamification.mascot_link
    module: gamification
    field_path: brand.gamification.mascot_link
    label: Character link
    prompt:
      en: Do progress visuals change the character stage? If the mascot is off, say no.
      fa: آیا تصویرهای پیشرفت، مرحلهٔ شخصیت را عوض می‌کنند؟ اگر مسکات خاموش است، no.
      tr: İlerleme görselleri karakter aşamasını değiştirir mi? Maskot kapalıysa no.
    why_it_matters: Stage changes are owned by the mascot module. This field only links them.
    why_it_matters_i18n:
      fa: تغییر مرحله در اختیار ماژول مسکات است؛ این فیلد فقط آن‌ها را به هم پیوند می‌دهد.
      tr: Aşama değişiklikleri maskot modülüne aittir. Bu alan yalnızca bağlantı kurar.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: no"
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: no"
      tr:
        - "EXAMPLE ONLY: no"
    required_when: always
    skip_when: config.modules.gamification == false
    depends_on:
      - brand.gamification.enabled
    priority: high
    order: 704
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/gamification.md
    related_ids:
      - brand.mascot.unlocks
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
