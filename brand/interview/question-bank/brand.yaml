  - id: brand.verbal.name_use
    module: verbal-identity
    field_path: brand.verbal.name_use
    label: Name usage
    prompt:
      en: How is the trade name spelled, pronounced, and never altered?
      fa: نام تجاری چگونه نوشته، تلفظ و هرگز تغییر داده نشود؟
      tr: Ticari ad nasıl yazılır, söylenir ve asla nasıl değiştirilmez?
    why_it_matters: Logo and voice start from one spelling.
    why_it_matters_i18n:
      fa: لوگو و لحن از یک املای واحد شروع می‌شوند.
      tr: Logo ve ses tonu tek bir yazımdan yola çıkar.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Use the full trade name. Pronunciation TBD by the owner."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: از نام تجاری کامل استفاده کنید. تلفظ را مالک بعداً مشخص می‌کند."
      tr:
        - "EXAMPLE ONLY: Ticari adın tamamını kullanın. Telaffuzu sahibi daha sonra belirleyecek."
    required_when: always
    depends_on:
      - business.identity.trade_name
    priority: high
    order: 60
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
