schema_version: 1
questions:
  - id: brand.personality.traits
    module: brand-strategy
    field_path: brand.personality.traits
    label: Personality
    prompt:
      en: Which personality traits should people feel from the brand, and which traits are out of bounds?
      fa: برند باید کدام ویژگی‌های شخصیتی را منتقل کند و کدام ویژگی‌ها خارج از محدوده‌اند؟
      tr: İnsanlar markadan hangi kişilik özelliklerini hissetmeli ve hangileri sınır dışıdır?
    why_it_matters: Voice, mascot behavior, and motion all inherit personality. A trait list without
      boundaries gets misused.
    why_it_matters_i18n:
      fa: لحن، رفتار ماسکات و حرکت همگی از شخصیت برند پیروی می‌کنند. فهرست ویژگی‌هایی که مرز نداشته باشد،
        به‌سادگی نادرست به کار می‌رود.
      tr: Ses tonu, maskot davranışı ve hareket kişilikten beslenir. Sınırları olmayan bir özellik listesi
        yanlış kullanılır.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Calm and precise. Not sarcastic. This is only an illustration."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: آرام و دقیق. نه کنایه‌آمیز. این فقط یک نمونه است."
      tr:
        - "EXAMPLE ONLY: Sakin ve titiz. Alaycı değil. Bu yalnızca bir örnektir."
    suggestions:
      - Name three traits and one excluded trait
      - Defer with decide later if the offer is still moving
    required_when: always
    depends_on: []
    priority: critical
    order: 10
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: &a1
      - owner
      - approved_import
      - external_cited
      - agent_suggestion
    related_outputs:
      - brand/generated/drafts/brand-strategy.md
      - brand/generated/drafts/verbal-identity.md
      - brand/generated/drafts/mascot-identity.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.strategy.purpose
    module: brand-strategy
    field_path: brand.strategy.purpose
    label: Purpose
    prompt:
      en: Why does this brand exist beyond making a sale? Answer unknown if you have not decided.
      fa: این برند، فراتر از فروش، چرا وجود دارد؟ اگر تصمیم نگرفته‌اید، ناشناخته.
      tr: Bu marka satışın ötesinde neden var? Karar vermediyseniz bilinmiyor.
    why_it_matters: Purpose is a long-horizon strategy sentence, not a campaign headline.
    why_it_matters_i18n:
      fa: هدف، جمله‌ای راهبردی با افق بلندمدت است، نه تیتر یک کمپین.
      tr: Amaç, bir kampanya başlığı değil, uzun vadeli bir strateji cümlesidir.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Unknown. Too early to claim a social purpose."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: ناشناخته. هنوز برای ادعای یک هدف اجتماعی زود است."
      tr:
        - "EXAMPLE ONLY: Bilinmiyor. Toplumsal bir amaç iddia etmek için henüz çok erken."
    required_when: always
    depends_on: []
    priority: high
    order: 40
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/brand-strategy.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.strategy.vision
    module: brand-strategy
    field_path: brand.strategy.vision
    label: Vision
    prompt:
      en: What future state would you like to be true if the brand works? Mark it as aspiration.
      fa: اگر برند کار کند، چه وضعیت آینده‌ای را می‌خواهید؟ آن را آرمان علامت بزنید.
      tr: Marka işe yararsa hangi gelecek doğru olsun? Bunu özlem olarak işaretleyin.
    why_it_matters: Vision is not a forecast and must not be charted as a metric.
    why_it_matters_i18n:
      fa: چشم‌انداز پیش‌بینی نیست و نباید مثل یک شاخص روی نمودار برود.
      tr: Vizyon bir tahmin değildir ve bir metrik gibi grafiğe dökülmemelidir.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Aspiration only: the category feels less intimidating. Not a forecast."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: فقط یک آرمان: این حوزه کمتر ترسناک به نظر برسد. پیش‌بینی نیست."
      tr:
        - "EXAMPLE ONLY: Yalnızca bir özlem: bu kategori daha az göz korkutucu hissettirsin. Bir
          tahmin değildir."
    required_when: always
    depends_on: []
    priority: high
    order: 41
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/brand-strategy.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: false
    weight: 1
    sector_hints: []
    status: unanswered
  - id: brand.strategy.values
    module: brand-strategy
    field_path: brand.strategy.values
    label: Values
    prompt:
      en: Which values will you actually use to refuse work? Skip the poster list.
      fa: با کدام ارزش‌ها واقعاً کار را رد می‌کنید؟ فهرست پوستر را کنار بگذارید.
      tr: İşi geri çevirmek için gerçekten hangi değerleri kullanacaksınız? Poster listesini bırakın.
    why_it_matters: Values that never change a decision are decoration.
    why_it_matters_i18n:
      fa: ارزش‌هایی که هیچ‌وقت تصمیمی را تغییر نمی‌دهند، فقط تزئین‌اند.
      tr: Hiçbir kararı değiştirmeyen değerler yalnızca süstür.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Unknown. No value has been tested against a decision yet."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: ناشناخته. هنوز هیچ ارزشی در برابر یک تصمیم واقعی سنجیده نشده است."
      tr:
        - "EXAMPLE ONLY: Bilinmiyor. Henüz hiçbir değer bir karar karşısında sınanmadı."
    required_when: always
    depends_on: []
    priority: high
    order: 42
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
