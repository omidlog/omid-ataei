    status: unanswered
  - id: brand.strategy.differentiation
    module: brand-strategy
    field_path: brand.strategy.differentiation
    label: Differentiation
    prompt:
      en: How should people tell this offer apart from the alternatives they actually consider? Cite
        evidence or label a hypothesis.
      fa: مردم این پیشنهاد را از جایگزین‌هایی که واقعاً در نظر می‌گیرند چطور جدا کنند؟ شواهد بیاورید یا
        فرضیه برچسب بزنید.
      tr: İnsanlar bu teklifi gerçekten düşündükleri alternatiflerden nasıl ayırsın? Kanıt verin veya
        hipotez deyin.
    why_it_matters: Competitive frames without sources become false advertising.
    why_it_matters_i18n:
      fa: مقایسه با رقبا بدون منبع، به تبلیغ گمراه‌کننده تبدیل می‌شود.
      tr: Kaynaksız rekabet karşılaştırmaları yanıltıcı reklama dönüşür.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Hypothesis: shorter sessions than a classroom. Not verified."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: فرضیه: جلسه‌ها کوتاه‌تر از کلاس حضوری‌اند. تأیید نشده."
      tr:
        - "EXAMPLE ONLY: Hipotez: oturumlar bir sınıftakinden daha kısa. Doğrulanmadı."
    required_when: always
    depends_on:
      - business.offer.value_proposition
    priority: high
    order: 43
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/brand-strategy.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.strategy.promise
    module: brand-strategy
    field_path: brand.strategy.promise
    label: Brand promise
    prompt:
      en: What will you promise only if you can keep it?
      fa: چه وعده‌ای را فقط اگر بتوانید به آن عمل کنید می‌دهید؟
      tr: Yalnızca tutabileceğiniz bir söz varsa o nedir?
    why_it_matters: A promise is a public commitment. Unknown is safer than an empty superlative.
    why_it_matters_i18n:
      fa: وعده یک تعهد عمومی است. «ناشناخته» از یک صفت عالی توخالی امن‌تر است.
      tr: Söz, kamuya açık bir taahhüttür. «Bilinmiyor» demek, içi boş bir üstünlük iddiasından daha
        güvenlidir.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: No promise approved."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: هیچ وعده‌ای تأیید نشده است."
      tr:
        - "EXAMPLE ONLY: Onaylanmış bir söz yok."
    required_when: always
    depends_on: []
    priority: high
    order: 44
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/brand-strategy.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.strategy.decision_rule
    module: brand-strategy
    field_path: brand.strategy.decision_rule
    label: Decision rule
    prompt:
      en: What rule should a teammate use to accept or reject a brand idea?
      fa: هم‌تیمی با چه قاعده‌ای یک ایدهٔ برند را بپذیرد یا رد کند؟
      tr: Bir ekip arkadaşı bir marka fikrini hangi kuralla kabul veya reddetsin?
    why_it_matters: Governance needs a rule before the asset library fills up.
    why_it_matters_i18n:
      fa: حاکمیت برند پیش از آنکه کتابخانهٔ دارایی‌ها پر شود، به یک قاعده نیاز دارد.
      tr: Yönetişim, varlık kütüphanesi dolmadan önce bir kurala ihtiyaç duyar.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Reject anything that claims a feature product.public_status does not allow."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: هر چیزی را که ادعای قابلیتی را دارد که product.public_status اجازه نمی‌دهد،
          رد کنید."
      tr:
        - "EXAMPLE ONLY: product.public_status alanının izin vermediği bir özelliği iddia eden her
          şeyi reddedin."
    required_when: always
    depends_on: []
    priority: high
    order: 45
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/brand-strategy.md
      - brand/generated/drafts/governance.md
    related_ids: []
    completion_rule: non_empty
    allows_unknown: true
    required: true
    weight: 2
    sector_hints: []
    status: unanswered
  - id: brand.strategy.experience
    module: brand-strategy
    field_path: brand.strategy.experience
    label: Experience principles
    prompt:
      en: Which experience principles should product, support, and marketing share?
      fa: محصول، پشتیبانی و بازاریابی کدام اصول تجربه را مشترک داشته باشند؟
      tr: Ürün, destek ve pazarlama hangi deneyim ilkelerini paylaşsın?
    why_it_matters: Principles connect the brand book to UI states and support copy.
    why_it_matters_i18n:
      fa: اصول تجربه، کتاب برند را به وضعیت‌های رابط کاربری و متن‌های پشتیبانی پیوند می‌دهد.
      tr: İlkeler, marka kitabını arayüz durumlarına ve destek metinlerine bağlar.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Tell the truth about progress. Do not shame a mistake. Illustration only."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: دربارهٔ پیشرفت راستش را بگویید. کسی را به خاطر اشتباه شرمنده نکنید. فقط یک
          نمونه است."
      tr:
        - "EXAMPLE ONLY: İlerleme konusunda doğruyu söyleyin. Bir hata yüzünden kimseyi
          utandırmayın. Yalnızca örnektir."
    required_when: always
    depends_on: []
    priority: high
    order: 46
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
      - brand/generated/drafts/brand-strategy.md
      - brand/generated/drafts/product-ui.md
