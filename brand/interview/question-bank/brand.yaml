  - id: brand.verbal.tagline
    module: verbal-identity
    field_path: brand.verbal.tagline
    label: Tagline
    prompt:
      en: Is there an approved tagline? If not, answer none.
      fa: شعار تأییدشده‌ای هست؟ اگر نه، none.
      tr: Onaylı bir slogan var mı? Yoksa none.
    why_it_matters: Empty lockups should not receive a filler slogan.
    why_it_matters_i18n:
      fa: جای خالی شعار در ترکیب لوگو نباید با یک شعار پرکننده پر شود.
      tr: Boş logo kilitlenmelerine dolgu niyetine bir slogan konmamalıdır.
    question_type: long_text
