  - id: brand.verbal.localization
    module: verbal-identity
    field_path: brand.verbal.localization
    label: Localization
    prompt:
      en: Which languages can carry official brand sentences, and who approves each?
      fa: کدام زبان‌ها می‌توانند جمله‌های رسمی برند را حمل کنند و هر کدام را چه کسی تأیید می‌کند؟
      tr: Hangi diller resmi marka cümlelerini taşıyabilir ve her birini kim onaylar?
    why_it_matters: The portal can show fa-IR and tr-TR chrome without translating approved claims.
    why_it_matters_i18n:
      fa: پورتال می‌تواند رابط را به fa-IR و tr-TR نشان دهد، بی‌آنکه ادعاهای تأییدشده ترجمه شوند.
      tr: Portal, onaylı iddiaları çevirmeden arayüzü fa-IR ve tr-TR olarak gösterebilir.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: English only until an owner approves another language."
