  - id: brand.verbal.forbidden
    module: verbal-identity
    field_path: brand.verbal.forbidden
    label: Forbidden language
    prompt:
      en: Which words, claims, or jokes are forbidden?
      fa: کدام واژه‌ها، ادعاها یا شوخی‌ها ممنوع‌اند؟
      tr: Hangi sözcükler, iddialar veya şakalar yasak?
    why_it_matters: Forbidden language is a review checklist, not a vibe.
    why_it_matters_i18n:
      fa: زبان ممنوع یک چک‌لیست بازبینی است، نه یک حس کلی.
      tr: Yasaklı dil bir his değil, bir inceleme kontrol listesidir.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: No “guaranteed fluency”, no fake awards, no shame."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: نه «تسلط تضمینی»، نه جایزهٔ ساختگی، نه شرمنده‌کردن."
      tr:
        - "EXAMPLE ONLY: “Garantili akıcılık” yok, sahte ödül yok, utandırma yok."
    required_when: always
    depends_on: []
    priority: high
    order: 64
    sensitivity: internal
    language:
      - en
      - fa
      - tr
    source_types: *a1
    related_outputs:
