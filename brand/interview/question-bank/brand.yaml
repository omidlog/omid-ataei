  - id: brand.verbal.voice
    module: verbal-identity
    field_path: brand.verbal.voice
    label: Tone of voice
    prompt:
      en: How should the brand sound in a normal product sentence, and how should it sound in an error?
      fa: برند در یک جملهٔ عادی محصول و در یک خطا چگونه صدا بدهد؟
      tr: Marka normal bir ürün cümlesinde ve bir hatada nasıl duyulsun?
    why_it_matters: Channel tone adapts a base voice. Errors are where brands usually break character.
    why_it_matters_i18n:
      fa: لحن هر کانال، نسخهٔ تطبیق‌یافتهٔ یک لحن پایه است. پیام‌های خطا معمولاً جایی‌اند که برندها از
        شخصیت خود خارج می‌شوند.
      tr: Kanal tonu, temel bir sesi uyarlar. Markalar karakterden en çok hata mesajlarında çıkar.
    question_type: long_text
    examples:
      - "EXAMPLE ONLY: Plain and specific. Errors say what happened and what to do next.
        Illustration only."
    examples_i18n:
      fa:
        - "EXAMPLE ONLY: ساده و مشخص. پیام خطا می‌گوید چه اتفاقی افتاد و قدم بعدی چیست. فقط یک نمونه
          است."
      tr:
        - "EXAMPLE ONLY: Sade ve net. Hata mesajları ne olduğunu ve sırada ne yapılacağını söyler.
          Yalnızca örnektir."
    required_when: always
    depends_on:
      - brand.personality.traits
    priority: high
    order: 63
