# Social style kit (docs-internal/SOCIAL_STYLE_KIT.md). Design guidance, committed: never put a restricted value here.
# Colours and fonts are design-token ids, zones are % of the canvas, layers are listed back to front.
# Agents read only approved styles. Approve with npm run brand:social -- kit review / kit approve (owner proof).
# Editing an approved style or the family makes the approval invalid until the owner approves again.
schema_version: 1
kind: social_style_kit
brand_slug: omid-ataei
family:
  type:
    headline: type.fontFamily.display
    body: type.fontFamily.body
    accent: null
  palette:
    background: color.light.canvas
    text: color.light.text
    muted: color.light.muted
    primary: color.brand.primary
    on_primary: color.brand.onPrimary
    secondary: color.brand.secondary
    on_secondary: color.brand.onSecondary
    accent: color.brand.accent
    dark_canvas: color.dark.canvas
    dark_text: color.dark.text
  logo:
    placement: bottom_right
    size_pct: 12
    asset: missing
    rule_refs:
      - brand.logo.clear_space
      - brand.logo.min_size
      - brand.logo.misuse
  photo_direction:
    fact_refs:
      - brand.photo.direction
      - brand.photo.lighting
      - brand.photo.grade
      - personal.media.photo_guidelines
  corner_radius: radius.lg
  grid:
    margin_pct: 6
    columns: 6
    gutter_pct: 2
styles:
  - id: post.bold-statement
    surface: post
    archetype: bold-statement
    name:
      en: Bold statement
      fa: جملهٔ پررنگ
      tr: Güçlü cümle
    intent:
      use_when:
        en: One strong opinion or takeaway, no photo needed.
        fa: یک دیدگاه یا نکتهٔ کلیدی و محکم، بدون نیاز به عکس.
        tr: Tek bir güçlü görüş ya da çıkarım; fotoğraf gerekmez.
      content_types:
        - inspire
        - educate
      pillar: null
    layers:
      - role: background
        zone: full
        color: color.brand.primary
      - role: shape
        zone:
          x: 6
          y: 14
          w: 12
          h: 1.2
        color: color.brand.accent
      - role: headline
        zone:
          x: 6
          y: 20
          w: 88
          h: 46
        color: color.brand.onPrimary
        font: type.fontFamily.display
        max_words: 10
        max_lines: 4
        rules:
          - one_message
      - role: subhead
        zone:
          x: 6
          y: 70
          w: 70
          h: 10
        color: color.brand.onPrimary
        font: type.fontFamily.body
        max_words: 14
        max_lines: 2
      - role: handle
        zone:
          x: 6
          y: 90
          w: 50
          h: 4
        color: color.brand.onPrimary
        font: type.fontFamily.body
        max_words: 4
        max_lines: 1
      - role: brand_mark
        zone:
          x: 76
          y: 88
          w: 18
          h: 6
        rules:
          - brand_mark_small
    variation:
      en: "Type-led: a full-bleed brand colour and one large headline."
      fa: "متن‌محور: پس‌زمینهٔ تمام‌رنگِ برند و یک تیتر بزرگ."
      tr: "Yazı odaklı: tam kaplayan marka rengi ve tek büyük başlık."
    do:
      - one_message
      - high_contrast
      - readable_at_thumb_size
    dont:
      - no_dense_paragraphs
      - no_more_than_three_colors
    reference_assets: missing
    status: draft
