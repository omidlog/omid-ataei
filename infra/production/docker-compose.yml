# Brand OS Studio on the shared VPS.
#
# Install as /opt/brand-os-studio/docker-compose.yml. Layout (see docs-internal/phase-10/DEPLOY.md):
#
#   /opt/brand-os-studio/
#     docker-compose.yml   this file
#     .env                 settings + GitHub credentials (from infra/production/.env.example), mode 0600
#     secrets/owner.env    owner sign-in, written by `studio bootstrap-owner`, mode 0600
#     src/                 git checkout of the reviewed commit (build context)
#     data/                persistent Studio state (registry, sync cache), owned by uid 1000, mode 0700
#     backups/             output of infra/production/backup.sh
#
# The only published port is 172.18.0.1:8083, the gateway of the shared proxy network, which the
# existing edge Caddy (financebot-caddy-1) reaches. Nothing listens on 0.0.0.0. The image tag is the
# reviewed commit, so a rollback is "set STUDIO_IMAGE_TAG to the previous tag and up -d --no-build".
name: brand-os-studio

services:
  studio:
    image: brand-os-studio:${STUDIO_IMAGE_TAG:?set STUDIO_IMAGE_TAG in .env to the reviewed commit (12-char short SHA)}
    build:
      context: ./src
      dockerfile: infra/production/Dockerfile
      args:
        BUILD_REVISION: ${STUDIO_BUILD_REVISION:-unknown}
    restart: unless-stopped
    init: true
    env_file:
      - path: ./.env
        required: true
      - path: ./secrets/owner.env
        required: true
    # Fixed by the container layout. These override anything in the env files.
    environment:
      STUDIO_HOST: 0.0.0.0
      STUDIO_PORT: "4100"
      STUDIO_DATA_DIR: /data
      STUDIO_TRUST_PROXY: "1"
    ports:
      - "172.18.0.1:8083:4100"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
