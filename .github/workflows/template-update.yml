# Template update (optional). Keeps one pull request open in this brand repository that brings in the
# latest Brand OS template. It never pushes to the default branch, never merges and never touches
# brand-owned files. It does nothing until the owner adds the BRAND_OS_TEMPLATE_TOKEN secret.
# Setup in plain words: docs/template-update-action.md
name: Template update

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:17 UTC.
    - cron: '17 6 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: template-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: check setup
        id: setup
        env:
          TEMPLATE_TOKEN: ${{ secrets.BRAND_OS_TEMPLATE_TOKEN }}
        run: |
          if [ -z "$TEMPLATE_TOKEN" ]; then
            echo "::notice title=Template update is off::Add the repository secret BRAND_OS_TEMPLATE_TOKEN (read access to the Brand OS template) to turn it on. See docs/template-update-action.md. Nothing was done."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.setup.outputs.enabled == 'true'
        with:
          fetch-depth: 0
          # The optional BRAND_OS_PR_TOKEN may push workflow changes and lets checks run on the pull request.
          token: ${{ secrets.BRAND_OS_PR_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        if: steps.setup.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm

      - name: clone the template
        if: steps.setup.outputs.enabled == 'true'
        env:
          TEMPLATE_TOKEN: ${{ secrets.BRAND_OS_TEMPLATE_TOKEN }}
          TEMPLATE_REPOSITORY: ${{ vars.BRAND_OS_TEMPLATE_REPOSITORY }}
        run: |
          repo="${TEMPLATE_REPOSITORY:-$(node -p "require('./.brand-os/sync.json').template.repository || ''")}"
          if [ -z "$repo" ]; then
            echo "::error::No template repository: set the BRAND_OS_TEMPLATE_REPOSITORY variable or template.repository in .brand-os/sync.json."
            exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$TEMPLATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          # Full history: the update compares the commit this brand records with the template's latest.
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --quiet "https://github.com/$repo.git" "$RUNNER_TEMP/brand-os-template"

      - run: npm ci
        if: steps.setup.outputs.enabled == 'true'

      - name: open or update the template update pull request
        if: steps.setup.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.BRAND_OS_PR_TOKEN || github.token }}
          TEMPLATE_UPDATE_CAN_PUSH_WORKFLOWS: ${{ secrets.BRAND_OS_PR_TOKEN != '' && '1' || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx tsx scripts/template-update-pr.ts --template "$RUNNER_TEMP/brand-os-template"
